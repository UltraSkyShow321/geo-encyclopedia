services:
  app:
    build: .
    image: geo-encyclopedia:latest
    container_name: geo-encyclopedia
    restart: always
    # 监听所有网卡: 局域网设备可直接访问 NAS:3000；外网走穿透链路（绿联远程访问/CF Tunnel）
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    volumes:
      - ./data:/app/data
      - ./content:/app/content
      - ./.env:/app/.env:ro

  # 备用外网链路: Cloudflare Tunnel（需要 .env 里配置 TUNNEL_TOKEN）
  # 用法: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: geo-encyclopedia-tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
