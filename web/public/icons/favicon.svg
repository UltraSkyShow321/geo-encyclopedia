<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="earth" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="hi" cx="34%" cy="28%" r="32%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="globe"><circle cx="256" cy="272" r="148"/></clipPath>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <circle cx="256" cy="272" r="148" fill="url(#earth)"/>
  </g>

  <g clip-path="url(#globe)">
    <!-- 经纬线网格 -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2.4">
      <ellipse cx="256" cy="272" rx="148" ry="52"/>
      <ellipse cx="256" cy="272" rx="148" ry="104"/>
      <line x1="108" y1="272" x2="404" y2="272"/>
      <ellipse cx="256" cy="272" rx="52" ry="148"/>
      <ellipse cx="256" cy="272" rx="104" ry="148"/>
      <line x1="256" y1="124" x2="256" y2="420"/>
    </g>
    <!-- 简化大陆（绿） -->
    <g fill="#34d399" fill-opacity="0.92">
      <!-- 亚欧 -->
      <path d="M180 210 Q220 188 270 196 Q330 200 360 224 Q372 240 350 250 Q300 252 250 246 Q210 240 186 248 Q170 236 180 210 Z"/>
      <!-- 非洲 -->
      <path d="M250 252 Q280 250 300 270 Q312 300 300 330 Q288 358 268 356 Q252 340 250 310 Q244 282 250 252 Z"/>
      <!-- 北美 -->
      <path d="M150 238 Q172 220 196 232 Q210 250 200 268 Q176 272 158 260 Q146 250 150 238 Z"/>
      <!-- 南美 -->
      <path d="M178 286 Q196 282 204 300 Q210 326 200 348 Q188 360 178 348 Q170 322 178 286 Z"/>
      <!-- 大洋洲 -->
      <path d="M330 312 Q360 308 372 322 Q374 338 356 344 Q334 344 326 332 Q322 320 330 312 Z"/>
    </g>
  </g>

  <!-- 高光 -->
  <ellipse cx="200" cy="226" rx="92" ry="54" fill="url(#hi)"/>

  <!-- 定位针 -->
  <g filter="url(#sh)" transform="translate(326 150)">
    <path d="M26 0 C26 14 16 26 0 46 C-16 26 -26 14 -26 0 A26 26 0 0 1 26 0 Z" fill="url(#pin)"/>
    <circle cx="0" cy="2" r="10" fill="#1e3a8a"/>
    <circle cx="0" cy="2" r="6.5" fill="#ffffff"/>
  </g>
</svg>